version: "3.9"

services:
  # ── ML Service ──────────────────────────────────────────────────────────────
  ml-service:
    build: ./ml-service
    container_name: mvm_ml
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - HOST=0.0.0.0
      - PORT=8000
      # In production set ALLOWED_ORIGINS to your real backend + frontend URLs
      - ALLOWED_ORIGINS=http://localhost:5000,http://localhost:5173
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 15s
      start_period: 60s
      retries: 3

  # ── Backend API ─────────────────────────────────────────────────────────────
  server:
    build: ./server
    container_name: mvm_server
    restart: unless-stopped
    ports:
      - "5000:5000"
    depends_on:
      ml-service:
        condition: service_healthy
    environment:
      - NODE_ENV=production
      - PORT=5000
      # Copy from server/.env or inject directly
      - MONGODB_URI=${MONGODB_URI}
      - JWT_SECRET=${JWT_SECRET}
      - ML_SERVICE_URL=http://ml-service:8000
      - CLIENT_URL=${CLIENT_URL}
      - SERVER_URL=${SERVER_URL}
      - CLOUDINARY_CLOUD_NAME=${CLOUDINARY_CLOUD_NAME}
      - CLOUDINARY_API_KEY=${CLOUDINARY_API_KEY}
      - CLOUDINARY_API_SECRET=${CLOUDINARY_API_SECRET}
      - PHONEPE_HOST=${PHONEPE_HOST}
      - PHONEPE_MERCHANT_ID=${PHONEPE_MERCHANT_ID}
      - PHONEPE_SALT_KEY=${PHONEPE_SALT_KEY}
      - PHONEPE_SALT_INDEX=${PHONEPE_SALT_INDEX}
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:5000/api/health"]
      interval: 30s
      timeout: 10s
      start_period: 30s
      retries: 3

# NOTE: The frontend (React/Vite) should be built separately and served via a
# CDN (e.g. Vercel, Netlify) or as static files. When running locally the Vite
# dev server proxies /api requests to http://localhost:5000 (see vite.config.js).
